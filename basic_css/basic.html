<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }
        .card{
        background-color: #d5d4d4;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        width: 300px;
        }
        h2{
            color: #1a50a0;
            text-align: center;
            margin-top: 0;
        }
        form{
            display: flex;
            flex-direction: column;
        }
        input{
            margin-bottom: 15px;
            padding: 15px;
            margin: 10px;
            border: 1px solid black;
            border-radius: 5px;
            border-color: #1a50a0;
        }
        button{
            background-color: #144ea4;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover{
            background-color: #1570c6;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form>
            <input type="email" name="Email" placeholder="enter your email..."/>
            <input type="password" name="Password" placeholder="enter your password..."/>
            <button type="submit">Login</button>
        </form>
    
    </div>
</body>
</html>
